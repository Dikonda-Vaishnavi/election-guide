<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectionGuide</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="logo">🗳 ElectionGuide</div>
    <nav>
      <button data-tab="chat">💬 Ask</button>
      <button data-tab="timeline">📅 Timeline</button>
      <button data-tab="glossary">📖 Glossary</button>
      <button data-tab="quiz">✅ Quiz</button>
      <button data-tab="translate">🌐 Translate</button>
    </nav>
  </header>

  <main>
    <section id="hero" class="hero">
      <h1>Understand Elections, One Step at a Time</h1>
    </section>

    <div id="tab-chat" class="tab-panel" style="display:block">
      <div id="google_translate_element"></div>
      <div class="quick-chips">
        <button class="chip">How do I register?</button>
        <button class="chip">What is a primary?</button>
        <button class="chip">Where do I vote?</button>
        <button class="chip">When is election day?</button>
        <button class="chip">Can I vote by mail?</button>
        <button class="chip">What is the electoral college?</button>
      </div>
      <div id="chat-area"></div>
      <div class="chat-input-container">
        <input type="text" id="chat-input" placeholder="Ask a question...">
        <button id="send-btn">Send</button>
      </div>
    </div>

    <div id="tab-timeline" class="tab-panel" style="display:none">
      <div id="timeline-container"></div>
    </div>

    <div id="tab-glossary" class="tab-panel" style="display:none">
      <input type="text" id="glossary-search" placeholder="Search terms...">
      <div id="glossary-container"></div>
    </div>

    <div id="tab-quiz" class="tab-panel" style="display:none">
      <div id="quiz-container"></div>
    </div>

    <div id="tab-translate" class="tab-panel" style="display:none">
      <h2>Translation Options</h2>
      <p>Use the Google Translate widget located in the Ask tab to translate the page.</p>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script src="config.js"></script>
</body>
</html>
